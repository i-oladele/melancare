[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melancare"
version = "0.1.0"
description = "Deep learning classification and explainability for dermoscopic skin lesion images (HAM10000)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
